[package]
edition      = "2024"
license      = "MIT"
name         = "driver"
rust-version = "1.88"
version      = "0.1.0"

[workspace]

[[bin]]
name = "driver"
path = "./src/bin/main.rs"
test = false

[[test]]
harness = false
name    = "hello_test"

[lib]
test = false

[features]
default = ["radio"]
# esp-radio cannot run Wi-Fi and IEEE 802.15.4 at the same time, so only one
# of these can be enabled per build.
mqtt  = ["dep:embassy-net", "dep:smoltcp", "esp-radio/wifi"]
radio = ["esp-radio/ieee802154"]

[dependencies]
embedded-io-async = "0.7.0"
embedded-storage  = "0.3.1"
heapless          = "0.9.3"
protocol          = { path = "../protocol" }

[target.'cfg(target_os = "none")'.dependencies]
critical-section = "1.2.0"
defmt = "1.0.1"
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", optional = true, features = [
  "defmt",
  "dhcpv4",
  "dns",
  "medium-ethernet",
  "tcp",
] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
esp-alloc = { version = "0.10.0", features = ["defmt"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32c6"] }
esp-hal = { version = "~1.1.0", features = ["defmt", "esp32c6", "unstable"] }
esp-radio = { version = "0.18.0", features = [
  "defmt",
  "esp-alloc",
  "esp32c6",
  "unstable",
] }
esp-rtos = { version = "0.3.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
] }
esp-storage = { version = "0.9.0", features = ["esp32c6"] }
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }
protocol = { path = "../protocol", features = ["defmt"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }
smoltcp = { version = "0.13.0", optional = true, default-features = false, features = [
  "defmt",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-tcp",
  "socket-udp",
] }
static_cell = "2.1.1"

[dev-dependencies]
embassy-futures = "0.1.2"
serde_json      = "1.0"

[target.'cfg(target_os = "none")'.dev-dependencies]
embedded-test = { version = "0.7.1", features = [
  "defmt",
  "embassy-010",
  "external-executor",
] }

[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"
