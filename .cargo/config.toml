[alias]
build-driver = "build --package driver --target riscv32imac-unknown-none-elf"
build-remote = "build --package remote --target thumbv7em-none-eabihf"
run-driver   = "run --package driver --target riscv32imac-unknown-none-elf"
run-remote   = "run --package remote --target thumbv7em-none-eabihf"
test-host    = "test --package protocol --package driver --package remote --lib"

[target.riscv32imac-unknown-none-elf]
runner = "probe-rs run --chip=esp32c6 --preverify --always-print-stacktrace --no-location"
# Required to obtain backtraces, may negatively impact performance
rustflags = ["-C", "force-frame-pointers"]

[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip nRF52840_xxAA"

[env]
DEFMT_LOG = "info"
