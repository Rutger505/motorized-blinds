[package]
edition      = "2024"
license      = "MIT"
name         = "remote"
rust-version = "1.88"
version      = "0.1.0"

[workspace]

[[bin]]
name = "remote"
path = "src/bin/main.rs"
test = false

[lib]
test = false

[dependencies]
heapless = "0.9.3"
protocol = { path = "../protocol" }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { version = "0.7.7", features = [
  "critical-section-single-core",
  "inline-asm",
] }
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embassy-executor = { version = "0.10.0", features = [
  "defmt",
  "executor-thread",
  "platform-cortex-m",
] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11.0", features = [
  "defmt",
  "gpiote",
  "nrf52840",
  "time",
  "time-driver-rtc1",
  "unstable-pac",
] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
protocol = { path = "../protocol", features = ["defmt"] }
static_cell = "2.1.1"

[dev-dependencies]
embassy-futures = "0.1.2"

[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"
